<title>Be Creative. — DRESSROOM</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; min-height:100%; }
  body { background:#fff; overflow:hidden; font-family: 'Arial Black','Inter Display', 'Arial', sans-serif; color:#d50a12; }
  #stage { position:fixed; inset:0; background:#fff; overflow:hidden; isolation:isolate; }
  .line-stage { position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); width:min(550px,78vw); height:134px; perspective:800px; }
  #wordImage { display:block; width:100%; height:auto; }
  #finalWord { position:absolute; inset:0; opacity:0; will-change:opacity,transform; user-select:none; pointer-events:none; }
  #ticker {
    position:absolute; left:50%; top:50%; width:max-content; max-width:none;
    white-space:nowrap; transform:translate(-50%,-50%);
    font-family:'Arial Black','Noto Sans','Noto Sans Arabic','Noto Sans Devanagari','Arial',sans-serif;
    font-weight:900; line-height:1.12; letter-spacing:-.035em; font-size:clamp(42px,5.7vw,75px);
    color:#e60618; text-shadow:0 1px 0 #fb7a78,0 3px 0 #ad0014,0 8px 15px #dd00112f;
    -webkit-font-smoothing:antialiased; backface-visibility:visible; transform-style:preserve-3d;
    will-change:transform,filter,opacity;
  }
  #ticker:before { content:''; display:block; position:absolute; z-index:5; height:1px; left:0; right:0; top:51%; background:rgba(86,0,10,.32); box-shadow:0 1px 0 rgba(255,255,255,.6); opacity:var(--seam,0); }
  #ticker:after { content:''; position:absolute; z-index:-1; inset:6px -6px; border-radius:4px; border:1px solid transparent; opacity:var(--seam,0); }
  #star {
    position:absolute; top:0; left:0; width:158px; height:148px; object-fit:contain; pointer-events:none;
    transform:translate(-50%,-50%) scale(0); transform-origin:50% 50%;
    will-change:transform,top,left,filter,opacity; filter:drop-shadow(0 6px 12px rgba(100,91,211,.15));
  }
  #enter {
    position:absolute; width:min(680px,85vw); height:210px; top:54%; left:50%; transform:translate(-50%,-50%);
    display:block; border:0; background:transparent; color:transparent; cursor:default; opacity:0; pointer-events:none;
  }
  #enter.ready { pointer-events:auto; cursor:pointer; }
  #enter:focus-visible { outline:2px solid #b3a5fa; outline-offset:4px; border-radius:16px; }
  #hint { position:absolute; top:calc(54% + 116px); left:50%; transform:translateX(-50%); color:#9b9b9f;
     font:600 10px/1.4 'Inter Display','Arial',sans-serif; letter-spacing:.29em; white-space:nowrap; opacity:0; }
  #replay { position:absolute; right:clamp(18px,4vw,56px); bottom:clamp(20px,4vw,42px);
    border:0; background:transparent; color:#a9a9ad; font:600 10px/1.2 'Arial',sans-serif; letter-spacing:.18em;
    cursor:pointer; padding:12px; opacity:0; }
  #replay:hover{color:#d80b22} #replay:focus-visible{outline:2px solid #f3bbcd;border-radius:8px}
  @media (max-width:650px){
    .line-stage { width:83vw; height:90px; top:51%; }
    #hint {top:calc(51% + 77px)}
    #enter {top:51%;height:160px}
    #star {width:132px;height:125px}
    #ticker {font-size:clamp(27px,10vw,42px)}
  }
  @media(prefers-reduced-motion:reduce){#ticker{display:none!important}}
</style>

  <button id="enter" aria-label="Enter DRESSROOM character creator"></button>
  <div id="hint" aria-hidden="true">CLICK TO ENTER</div>
  <button id="replay" title="Replay animation" aria-label="Replay animation">↻ &nbsp; REPLAY</button>
</div>
<script>
(() => {
  'use strict';
  const ticker=document.getElementById('ticker');
  const finalWord=document.getElementById('finalWord');
  const wordImage=document.getElementById('wordImage');
  const star=document.getElementById('star');
  const enter=document.getElementById('enter');
  const hint=document.getElementById('hint');
  const replay=document.getElementById('replay');
  const stage=document.getElementById('lineStage');
  const duration=5600;
  const phrases=[
    'Sé creativo.',
    '发挥创意。',
    'रचनात्मक बनें।',
    'كُن مبدعًا.',
    'Be Creative.'
  ];
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smooth=(v)=>{v=clamp(v);return v*v*(3-2*v)};
  const easeOut=(v)=>1-Math.pow(1-clamp(v),3);
  const lerp=(a,b,v)=>a+(b-a)*v;
  let start=performance.now();
  let recordMode=false;
  let last=0;

  function draw(ms){
    const t=clamp(ms,0,duration);
    last=t;
    // Language flip: airport split flap with quick 105ms turnovers,
    // all seams disappear when the final letters settle.
    const active=t>=120&&t<2740;
    const beat=106;
    const elapsed=Math.max(0,t-120);
    const index=Math.floor(elapsed/beat);
    const frac=(elapsed%beat)/beat;
    let phrase=phrases[index%phrases.length];
    // End on English to make the transition visually coherent.
    if(t>2490) phrase='Be Creative.';
    ticker.textContent=phrase;
    ticker.lang=(phrase.includes('发挥')?'zh':phrase.includes('रचनात्मक')?'hi':phrase.includes('كُن')?'ar':phrase.includes('Sé')?'es':'en');
    ticker.dir=ticker.lang==='ar'?'rtl':'ltr';
    const entry=easeOut(t/1360);
    const tickEase=active?Math.sin(frac*Math.PI):0;
    const flipAngle=active?(frac<.5?lerp(0,-80,frac*2):lerp(80,0,(frac-.5)*2)):0;
    const flyX=lerp(-240,0,entry);
    const flyY=lerp(67,0,entry);
    const blur=lerp(8,0,entry)+tickEase*.55;
    const tickerOpacity=t<120?clamp(t/120):t<2510?1:1-smooth((t-2510)/310);
    const fontScale=phrase.includes('रचनात्मक')? .82:phrase.includes('发挥')?.94:phrase.includes('كُن')?1.04:1;
    ticker.style.fontSize=`calc(clamp(42px,5.7vw,75px) * ${fontScale})`;
    ticker.style.opacity=tickerOpacity;
    ticker.style.filter=`blur(${blur.toFixed(2)}px)`;
    ticker.style.setProperty('--seam',active?clamp(.16+tickEase*.74):0);
    ticker.style.transform=`translate(calc(-50% + ${flyX.toFixed(2)}px),calc(-50% + ${flyY.toFixed(2)}px)) perspective(800px) rotateX(${flipAngle.toFixed(1)}deg) scale(${lerp(.88,1,entry).toFixed(3)})`;
    const finalOpacity=smooth((t-2530)/350);
    finalWord.style.opacity=String(finalOpacity);
    finalWord.style.transform=`translateY(${(1-finalOpacity)*8}px) scale(${(1-finalOpacity)*.975+finalOpacity})`;

    // Star emerges small, spins once, blooms to ~half-size, then
    // travels diagonally and shrinks into the dot position of the i.
    const vw=window.innerWidth, vh=window.innerHeight;
    const rect=wordImage.getBoundingClientRect();
    const peakX=vw*.5;
    const peakY=vh*(vw<650?.51:.54)-174*(vw<650?.63:1);
    // exact fixed point on the original red wordmark crop (dot on letter i)
    const dotX=rect.left+rect.width*.717;
    const dotY=rect.top+rect.height*.175;
    let x=peakX,y=peakY,scale=0,rotation=0,opacity=0;
    if(t>=1440){
      const emerge=smooth((t-1440)/720);
      const shrink=smooth((t-3040)/1430);
      const sparkleScale=lerp(.14,.93,emerge);
      const finalScale=vw<650?.105:.139; // actual dot is ~20px across on desktop
      scale=lerp(sparkleScale,finalScale,shrink);
      x=lerp(peakX,dotX,shrink);
      y=lerp(peakY,dotY,shrink);
      rotation=360*clamp((t-1440)/1560);
      opacity=smooth((t-1440)/240);
    }
    star.style.left=x+'px';star.style.top=y+'px';
    star.style.opacity=String(opacity);
    star.style.transform=`translate(-50%,-50%) perspective(500px) rotateY(${rotation}deg) rotateZ(${rotation*.45}deg) scale(${scale})`;
    star.style.filter=`drop-shadow(0 ${lerp(8,1,smooth((t-3040)/1430))}px ${lerp(12,2,smooth((t-3040)/1430))}px rgba(103,78,213,.2))`;
    const ready=t>=5100;
    enter.classList.toggle('ready',ready);
    enter.style.opacity=ready?1:0;
    hint.style.opacity=String(smooth((t-4650)/600)*.85);
    replay.style.opacity=String(smooth((t-4650)/600));
  }
  function animate(now){
    if(recordMode) return;
    draw(now-start);
    if(now-start<duration+1000) requestAnimationFrame(animate);
  }
  function restart(){recordMode=false;start=performance.now();requestAnimationFrame(animate)}
  replay.addEventListener('click',restart);
  enter.addEventListener('click',()=>{
    if(last<5100)return;
    window.location.href='studio.html';
  });
  window.__setTime=(ms)=>{recordMode=true;draw(ms)};
  window.__getInfo=()=>({time:last,finalOpacity:finalWord.style.opacity,starX:star.style.left,starY:star.style.top,enterReady:enter.classList.contains('ready'),imageLoaded:wordImage.complete&&wordImage.naturalWidth>0});
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){recordMode=true;draw(duration)}
  else requestAnimationFrame(animate);
})();
</script>
</body>
